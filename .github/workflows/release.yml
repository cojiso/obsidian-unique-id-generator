name: Release Obsidian plugin

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - uses: oven-sh/setup-bun@v2

            # Obsidian downloads the release whose tag equals the version in manifest.json.
            - name: Check the tag matches manifest.json
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(jq -r .version manifest.json)"
                  if [ "$tag" != "$version" ]; then
                    echo "Tag $tag does not match manifest.json version $version" >&2
                    exit 1
                  fi

            - name: Build plugin
              run: |
                  bun install --frozen-lockfile
                  bun run check
                  bun run test
                  bun run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
