name: Check

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun run check
